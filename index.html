<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <title>TikTok Live Columns</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101014;
        color: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .app {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
      }

      .toolbar {
        z-index: 1;
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 16px;
        border-bottom: 1px solid #303039;
        background: #19191f;
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .toolbar-note {
        margin-left: 8px;
        color: #a2a2ac;
        font-size: 12px;
        font-weight: 400;
      }

      button,
      input {
        font: inherit;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #494952;
        border-radius: 8px;
        background: #292930;
        color: #f5f5f7;
        cursor: pointer;
      }

      button:hover {
        background: #36363f;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #25f4ee;
        outline-offset: 2px;
      }

      #columns {
        display: grid;
        width: 100%;
        min-height: 0;
        flex: 1;
        grid-auto-columns: minmax(min(100vw, 460px), 1fr);
        grid-auto-flow: column;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-snap-type: x proximity;
      }

      .column {
        display: flex;
        min-width: 0;
        height: 100%;
        flex-direction: column;
        border-right: 1px solid #303039;
        background: #09090c;
        scroll-snap-align: start;
      }

      .column-bar {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid #303039;
        background: #19191f;
      }

      .url {
        width: 100%;
        min-width: 0;
        height: 34px;
        padding: 0 9px;
        border: 1px solid #3b3b44;
        border-radius: 6px;
        background: #101014;
        color: #f5f5f7;
        font-size: 12px;
      }

      .open-link {
        flex: 0 0 auto;
        color: #25f4ee;
        font-size: 12px;
        text-decoration: none;
      }

      .remove {
        min-width: 34px;
        padding: 0;
        color: #ff8298;
        font-size: 18px;
      }

      .column iframe {
        display: block;
        width: 100%;
        min-height: 0;
        flex: 1;
        border: 0;
        background: #09090c;
      }

      @media (max-width: 520px) {
        .toolbar {
          min-height: 52px;
          padding-inline: 10px;
        }

        .toolbar-note {
          display: none;
        }

        #columns {
          grid-auto-columns: 100vw;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <h1 class="title">
          TikTok Live
          <span class="toolbar-note">Scroll horizontally to switch columns</span>
        </h1>
        <button id="add-column" type="button">＋ Add column</button>
      </header>
      <section id="columns" aria-label="TikTok iframe columns"></section>
    </main>

    <template id="column-template">
      <article class="column">
        <form class="column-bar">
          <label class="sr-only" hidden>TikTok URL</label>
          <input
            class="url"
            type="url"
            aria-label="TikTok URL"
            placeholder="https://www.tiktok.com/@username/live"
            required
          />
          <button type="submit">Load</button>
          <a class="open-link" target="_blank" rel="noopener noreferrer">Open ↗</a>
          <button class="remove" type="button" aria-label="Remove column">×</button>
        </form>
        <iframe
          title="TikTok Live"
          loading="lazy"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </article>
    </template>

    <script>
      (() => {
        const defaultUrl = "https://www.tiktok.com/@simo.uda/live";
        const columns = document.querySelector("#columns");
        const template = document.querySelector("#column-template");

        function addColumn(initialUrl = defaultUrl) {
          const column = template.content.firstElementChild.cloneNode(true);
          const input = column.querySelector(".url");
          const iframe = column.querySelector("iframe");
          const openLink = column.querySelector(".open-link");

          function loadUrl(url) {
            input.value = url;
            iframe.src = url;
            openLink.href = url;
          }

          column.querySelector("form").addEventListener("submit", (event) => {
            event.preventDefault();
            const url = input.value.trim();
            try {
              const parsed = new URL(url);
              if (parsed.protocol !== "https:" ||
                (parsed.hostname !== "tiktok.com" && !parsed.hostname.endsWith(".tiktok.com"))) {
                throw new Error("URL must use HTTPS and belong to tiktok.com.");
              }
              loadUrl(url);
            } catch (error) {
              input.setCustomValidity("Enter a valid HTTPS TikTok URL.");
              input.reportValidity();
            }
          });

          input.addEventListener("input", () => input.setCustomValidity(""));
          column.querySelector(".remove").addEventListener("click", () => column.remove());
          loadUrl(initialUrl);
          columns.append(column);
          column.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "end" });
        }

        document.querySelector("#add-column").addEventListener("click", () => addColumn());
        addColumn();
      })();
    </script>
  </body>
</html>
